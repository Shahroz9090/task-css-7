<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Positioning Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Advanced CSS Positioning Layout</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Gallery</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Sidebar</h2>
      <a href="#">Link 1</a>
      <a href="#">Link 2</a>
      <a href="#">Link 3</a>
      <a href="#">Link 4</a>
    </aside>

    <main class="content">
      <section class="sticky-box">
        <h3>Sticky Box</h3>
        <p>This box sticks to the top while scrolling inside content!</p>
      </section>

      <section class="position-area">
        <div class="absolute-box">
          <h3>Box 1</h3>
          <p>Absolute positioning</p>
        </div>

        <div class="relative-box">
          <h3>Box 2</h3>
          <p>Relative </p>
        </div>
      </section>

      <section class="cards">
        <div class="card"><h4>card 1</h4></div>
        <div class="card"><h4>card 2</h4></div>
        <div class="card"><h4>card 3</h4></div>
      </section>


    </main>
  </div>
</body>
</html>
